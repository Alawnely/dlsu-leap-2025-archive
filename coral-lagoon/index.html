cipants take on the role of stranded survivors who must use everyday life skills to complete survival tasks. From repairing clothes and applying first aid to tying knots and mastering other essential life skills, participants will test their real-world problem-solving abilities through fun, hands-on activities. This event offers a thrilling and practical way to sharpen everyday skills while building connections and making new friends under pressure.\",\"title\":\"LEAP 2025: Life Skills on Deck\",\"eventMedia\":{\"id\":2,\"event_id\":5,\"pub_as_bg\":1,\"pub_url\":\"/api/contentful/EhDsFSDo6OWyW1d0sbg05/bdc14af4cabdf1faea06891f065435bc/-LEAP_2025_Life_Skills_on_Deck-_Main_Pub.jpg\",\"contentful_id\":\"5bHBMMPlvKx3q8Ma5mrY5l\"},\"slug\":\"leap-2025-life-skills-on-deck\"}]}],[\"$\",\"div\",\"1\",{\"children\":[\"$\",\"$L22\",\"1\",{\"subtheme\":\"coral-lagoon\",\"id\":53,\"registered_slots\":45,\"max_slots\":45,\"descripton\":\"LEAP 2025: A Scoop of Magic is an engaging and hands-on workshop that offers students the opportunity to create their own ice cream from scratch in a fun and relaxed setting. Designed to encourage creativity, collaboration and beating the heat, the session will guide participants through a step-by-step process using simple, accessible ingredients—no specialized equipment required. This activity aims to provide a refreshing and enjoyable break from academic life, fostering meaningful connections and shared experiences through the joy of making and enjoying homemade ice cream.\",\"title\":\"LEAP 2025: Scoop of Magic\",\"eventMedia\":{\"id\":97,\"event_id\":53,\"pub_as_bg\":1,\"pub_url\":\"/api/contentful/r2cy6cHh5lD2zX6UpUxFy/8ab2251eca4878f84b030e0db449fc1c/-OTREAS-_LEAP_2025__Scoop_of_Magic.jpg\",\"contentful_id\":\"4qYEijldHcJgbPnPc4n446\"},\"slug\":\"leap-2025-scoop-of-magic\"}]}],[\"$\",\"div\",\"2\",{\"children\":[\"$\",\"$L22\",\"2\",{\"subtheme\":\"coral-lagoon\",\"id\":126,\"registered_slots\":60,\"max_slots\":60,\"descripton\":\"In an immersive session with two guest speakers, the participants will be primed on the relevance of climate action and the intricacies of plant care. Each person will inherit a succulent to nurture as their own to apply the insights gained from the class. This class aims to push Lasallians to take a small but meaningful step into a greener future, so when it comes to making a difference, you can Leaf it to Us!\",\"title\":\"LEAP 2025: Leaf It To Us!\",\"eventMedia\":{\"id\":102,\"event_id\":126,\"pub_as_bg\":1,\"pub_url\":\"/api/contentful/1XQ17Uy1zDt5XK000gU6KB/5a9a0111758a8e7385e7c5ac73477253/-HFHGC2425-_LEAP2025_LEAF_IT_TO_US_.jpg\",\"contentful_id\":\"5pxGa9S9XvApX27XSfpYa8\"},\"slug\":\"leap-2025-leaf-it-to-us\"}]}],[\"$\",\"div\",\"3\",{\"children\":[\"$\",\"$L22\",\"3\",{\"subtheme\":\"coral-lagoon\",\"id\":128,\"registered_slots\":45,\"max_slots\":45,\"descripton\":\"Through a hands-on crochet session, participants are introduced to Nomana, a purpose-driven social enterprise, while learning about its mission, values, and impact. The class fosters a deeper appreciation for artisan craft and highlights how creative pursuits can support community-based enterprises and social change.\",\"title\":\"LEAP 2025: Weaving Wonders: From Threads to Transformation\",\"eventMedia\":{\"id\":104,\"event_id\":128,\"pub_as_bg\":1,\"pub_url\":\"/api/contentful/5q0GJr3gQnPaA1FF2I9xKi/06922be7acc46d3cfafcbab27a91e52a/LEAP2025_HULTPRIZE__3__-_Nisha_Anne_Umila.png\",\"contentful_id\":\"7lWpID9Sy5hsA3jwubAqEm\"},\"slug\":\"leap-2025-weaving-wonders-from-threads-to-transformation\"}]}],[\"$\",\"div\",\"4\",{\"children\":[\"$\",\"$L22\",\"4\",{\"subtheme\":\"coral-lagoon\",\"id\":135,\"registered_slots\":200,\"max_slots\":200,\"descripton\":\"The seminar focuses on the topic of procrastination and the factors behind it. With Sir. Zapanta, a Psychologist, as our speaker, the class aims to provide facts and information on the psychological factors that affect the act of procrastination as well as providing science-backed tips and tricks on how to cope with Procrastination\",\"title\":\"LEAP 2025: Riding the Wave: A Dive into Procrastination\",\"eventMedia\":{\"id\":110,\"event_id\":135,\"pub_as_bg\":1,\"pub_url\":\"/api/contentful/6893R955Yj89aZyFcPGiM1/68ffebf5d114d9943709aad6aa69b74a/LEAP_2025_Main_Pub.png\",\"contentful_id\":\"6NHEonwmvH5HadyOVAko2k\"},\"slug\":\"leap-2025:-riding-the-wave:-a-dive-into-procrastination\"}]}],[\"$\",\"div\",\"5\",{\"children\":[\"$\",\"$L22\",\"5\",{\"subtheme\":\"coral-lagoon\",\"id\":150,\"registered_slots\":89,\"max_slots\":100,\"descripton\":\"LEAP 2025: Curtain Call for Change is an engaging seminar-meets-runway event exploring the intersection of fashion, creativity, and sustainability. Industry minds will share insights on design careers and sustainable practices, while participants are challenged to turn a simple everyday item into stylish creations. The experience, aligned with UN Sustainable Development Goal 12, ends with a mini-fashion show celebrating conscious, innovative fashion, proving that conscious fashion can still turn heads.\",\"title\":\"LEAP 2025: Curtain Call for Change\",\"eventMedia\":{\"id\":128,\"event_id\":150,\"pub_as_bg\":1,\"pub_url\":\"/api/contentful/2Af7R62kAe4kOLQwv9qMLY/ee4a33502b80cb8161bad868f0f16f0e/-FAST2024-_LEAP2025_Main_Pub__-_Rafael_Antonio_Reyes.jpg\",\"contentful_id\":\"4wm1QBFQ1OMUbAd0Aj1UDg\"},\"slug\":\"leap-2025-curtain-call-for-change4\"}]}],[\"$\",\"div\",\"6\",{\"children\":[\"$\",\"$L22\",\"6\",{\"subtheme\":\"coral-lagoon\",\"id\":151,\"registered_slots\":0,\"max_slots\":100,\"descripton\":\"LEAP 2025: Curtain Call for Change is an engaging seminar-meets-runway event exploring the intersection of fashion, creativity, and sustainability. Industry minds will share insights on design careers and sustainable practices, while participants are challenged to turn a simple everyday item into stylish creations. The experience, aligned with UN Sustainable Development Goal 12, ends with a mini-fashion show celebrating conscious, innovative fashion, proving that conscious fashion can still turn heads.\",\"title\":\"LEAP 2025: Curtain Call for Change\",\"eventMedia\":{\"id\":126,\"event_id\":151,\"pub_as_bg\":1,\"pub_url\":\"/api/contentful/2Af7R62kAe4kOLQwv9qMLY/ee4a33502b80cb8161bad868f0f16f0e/-FAST2024-_LEAP2025_Main_Pub__-_Rafael_Antonio_Reyes.jpg\",\"contentful_id\":\"7dJnOPE4S93CIUSm3wVtIF\"},\"slug\":\"4leap-2025-curtain-call-for-change\"}]}],[\"$\",\"div\",\"7\",{\"children\":[\"$\",\"$L22\",\"7\",{\"subtheme\":\"coral-lagoon\",\"id\":159,\"registered_slots\":90,\"max_slots\":90,\"descripton\":\"Aperture Unlocked is a creative photography workshop that empowers participants to become advocates through visual storytelling. Inspired by UNICEF’s mission, the session guides participants in capturing compelling images that reflect pressing social issues, ranging from children’s rights, education, and health, to environmental impacts and animal welfare. Through a short talk, a guided photo walk, and a reflection session, students will explore how photography can raise awareness, spark empathy, and inspire action. This hands-on experience encourages participants to use their creativity for a cause, turning powerful visuals into tools for advocacy and change.\",\"title\":\"LEAP 2025: Aperture Unlocked: Photography for Change\",\"eventMedia\":{\"id\":136,\"event_id\":159,\"pub_as_bg\":1,\"pub_url\":\"/api/contentful/6Ub8RcVCMbA7JHfbs9IwZD/5ebc2d8642ff09afa4c012777c7a9a56/Main_Pub_Aperture_Unlocked.png\",\"contentful_id\":\"4iGGUNQ45OhgG19jfFjOLk\"},\"slug\":\"leap-2025:-aperture-unlocked:-photography-for-change\"}]}],[\"$\",\"div\",\"8\",{\"children\":[\"$\",\"$L22\",\"8\",{\"subtheme\":\"coral-lagoon\",\"id\":166,\"registered_slots\":42,\"max_slots\":45,\"descripton\":\"The class is a pajama party-themed session centered on feminism, designed to create a relaxed and welcoming space for open dialogue, games, and shared experiences. Led by
