items from the random keepsake of the Lost Boys, and create either a one-page poem or flash fiction under 500 words. This event challenges them to see objects not just as things but as vessels of meaning and untold tales.\",\"title\":\"LEAP 2025: Whispering Keepsakes\",\"eventMedia\":{\"id\":35,\"event_id\":63,\"pub_as_bg\":1,\"pub_url\":\"/api/contentful/1uFkSbVfo3rJjnSWC54s8f/74983034f194452a16af1b9567ed293e/-WG-_LEAP_2025_Whispering_Keepsakes_Main_Pub.png\",\"contentful_id\":\"3WMSPIYu17FXnCoG8XBZzg\"},\"slug\":\"leap-2025-whispering-keepsakes\"}]}],[\"$\",\"div\",\"2\",{\"children\":[\"$\",\"$L22\",\"2\",{\"subtheme\":\"fairy-nook\",\"id\":116,\"registered_slots\":70,\"max_slots\":70,\"descripton\":\"LEAP2025: BinGLOW GO GO! is a structured bingo game session designed to foster excitement, engagement, and friendly competition among participants. Each player will receive an individual bingo card and race to complete a specified pattern—whether a line, a shape, or a full blackout—as numbers are drawn at random across multiple rounds. The activity promotes attentiveness, quick thinking, and camaraderie in a relaxed and enjoyable environment.\",\"title\":\"LEAP 2025: BinGLOW GO GO!\",\"eventMedia\":{\"id\":80,\"event_id\":116,\"pub_as_bg\":1,\"pub_url\":\"/api/contentful/3G4jX004yBRBzvr2QsGRhf/55c3d3d5620ab9aa00be233859f581a4/BinGLOW_GO_GO_Main_Pub_-Ver_1-__1__-_Althea_Beatrice_Benigay.png\",\"contentful_id\":\"2albykRnoa8lq2UtGLjuXx\"},\"slug\":\"leap-2025-binglow-go-go\"}]}]]}]]}],[\"$\",\"div\",null,{\"children\":[[\"$\",\"div\",null,{\"children\":[\"$\",\"h2\",null,{\"className\":\"text-[25px] sm:text-[30px] font-bold sm:ml-0 ml-4 font-playfair\",\"children\":\"Day 3\"}]}],[\"$\",\"$L21\",null,{\"loopItems\":false,\"row2\":false,\"itemsToShow\":[[\"$\",\"div\",\"0\",{\"children\":[\"$\",\"$L22\",\"0\",{\"subtheme\":\"fairy-nook\",\"id\":173,\"registered_slots\":150,\"max_slots\":150,\"descripton\":\"LEAP 2025: Tales from the Hollow is an asynchronous film viewing activity designed to bring students together for a day of inspiration, imagination, and reflection. Set against the enchanting backdrop of Fairy Nook, this LEAP class invites participants to slow down, reconnect with their inner child, and rediscover the beauty of creativity and possibility through the critically acclaimed animated film, Howl's Moving Castle by Studio Ghibli. The purpose of this event is to foster a space where minds, creatives, and dreamers alike can gather - not just to enjoy a film, but to reflect on the values that Howl's Moving Castle so powerfully conveys: the courage to change, the power of compassion, and the magic found in moving forward, even when the path seems uncertain.\",\"title\":\"LEAP 2025: Tales From The Hollow\",\"eventMedia\":{\"id\":145,\"event_id\":173,\"pub_as_bg\":1,\"pub_url\":\"/api/contentful/5d2iaXSY9W1twi7uTKcQS/b20b4fd6a32575382e881d0d489feb08/-CES-_LEAP-4_-_Micaela_Maurel_Guyamin.png\",\"contentful_id\":\"5P0w5awc7dabVDANRgoI95\"},\"slug\":\"leap-2025-tales-from-the-hollow\"}]}],[\"$\",\"div\",\"1\",{\"children\":[\"$\",\"$L22\",\"1\",{\"subtheme\":\"fairy-nook\",\"id\":146,\"registered_slots\":90,\"max_slots\":90,\"descripton\":\"This class event will feature the docu-drama film \\\"The Feminister\\\", it will be a 90-minute workshop that combines a screening of the 2018 documentary on Swedish Foreign Minister Margot Wallström with interactive political discussions and creative expression activities. Through visual storytelling, documentary analysis, and expressive dialogue, participants explore Wallström's feminist foreign policy and her resistance to traditional diplomatic norms. Mirroring Peter Pan's defiance of adult conventions, the event highlights how outsider perspectives and idealism can drive meaningful change.\",\"title\":\"LEAP 2025: POLIkula - The Feminine Rebellion\",\"eventMedia\":{\"id\":120,\"event_id\":146,\"pub_as_bg\":1,\"pub_url\":\"/api/contentful/5RqehjajHnaTb09iCzzxav/6605d441b20344ab79a1c0c7 {\"subtheme\":\"fairy-nook\",\"id\":27,\"registered_slots\":45,\"max_slots\":45,\"descripton\":\"LEAP 2025: Sit Still, Look Pretty! allows students to enter the world of portrait photography, where every click and light tells a story. Discover the craft and technique behind capturing beauty with intention-- mastering composition, lighting, and camera settings. With Addy's creative dust, students will learn and enhance their photography skills and unlock the power of visual storytelling through portraits.\",\"title\":\"Leap 2025: Sit Still, Look Pretty!\",\"eventMedia\":{\"id\":93,\"event_id\":27,\"pub_as_bg\":1,\"pub_url\":\"/api/contentful/2Qt0Hg7aYPuD9uRISnHJmA/8af0a9874398f6a11a022427fb4f7611/Main_Pub-edited.png\",\"contentful_id\":\"Giwi0WHhtqRjnbXWZwHi9\"},\"slug\":\"leap-2025-sit-still,-look-pretty!\"}]}],[\"$\",\"div\",\"4\",{\"children\":[\"$\",\"$L22\",\"4\",{\"subtheme\":\"fairy-nook\",\"id\":65,\"registered_slots\":45,\"max_slots\":45,\"descripton\":\"Participants will be given various colors of air-dry clay and will engage in a hands-on workshop where they will learn basic sculpting techniques and create their personalized clay crafts. The activity will include a short demonstration, guided practice, and a showcase of finished pieces.\",\"title\":\"LEAP 2025: Clay-tastic Creations with JRex\",\"eventMedia\":{\"id\":46,\"event_id\":65,\"pub_as_bg\":1,\"pub_url\":\"/api/contentful/58ChSOkwJrGLTCvBB85O2/f2488f949a9ad146fa0c6014367f394c/MAIN_PUB__2__-_Laramie_Geene_Canlas.jpg\",\"contentful_id\":\"72tWaoCRtWxorriPuYfYpf\"},\"slug\":\"leap-2025-clay-tastic-creations-with-jrex\"}]}],[\"$\",\"div\",\"5\",{\"children\":[\"$\",\"$L22\",\"5\",{\"subtheme\":\"fairy-nook\",\"id\":66,\"registered_slots\":60,\"max_slots\":60,\"descripton\":\"This face-to-face workshop provides an opportunity for participants to learn diamond painting. Following a tutorial video on how to diamond paint, the participants would create their own artworks based on prepared designs prior to s session. Surrounded by the enchanting world of Adventureland, participants will create whimsical skybound designs that celebrate freedom, flight, and limitless possibility. This relaxing, creative experience offers a joyful escape where imagination knows no bounds.\",\"title\":\"LEAP 2025: Skybound Strokes: Painting a World Without Limits\",\"eventMedia\":{\"id\":59,\"event_id\":78,\"pub_as_bg\":0,\"pub_url\":\"/api/contentful/4or4MVSE9UzIfpp7Z6IZOv/1fb49676d9eb1d4f32d98b7284a20341/LEAP_2025_Skybound_Strokes_Painting_a_World_Without_Limits_Main_Publication_Material.jpg\",\"contentful_id\":\"1daxHuyPMIHuObeUjGIHZQ\"},\"slug\":\"leap-2025-skybound-strokes-painting-a-world-without-limits\"}]}],[\"$\",\"div\",\"8\",{\"children\":[\"$\",\"$L22\",\"8\",{\"subtheme\":\"fairy-nook\",\"id\":86,\"registered_slots\":45,\"max_slots\":45,\"descripton\":\"LEAP 2025: Remembering Us is a writing workshop that offers a safe place and imaginative creativity, making the writers look back, and allow them to write entries about a childhood memory that sticks to them. Writers would be split into equal groups, having to collaborate on a poem or prose piece about a childhood-related memory or object. Overall, the organization seeks to let the participants explore their childhood memories, inspiring them out the nostalgia of those times.\",\"title\":\"LEAP 2025: Remembering Us\",\"eventMedia\":{\"id\":67,\"event_id\":86,\"pub_as_bg\":0,\"pub_url\":\"/api/contentful/6hrLrO0FjAw6VVL6gW94sW/53aa4d867693e57d947f3ebd8b31681a/-WG-_LEAP_2025__Remembering_Us_Main_Pub.png\",\"contentful_id\":\"79yrZlNX8zxeEIh8dFgGZX\"},\"slug\":\"leap-2025-remembering-us\"}]}],[\"$\",\"div\",\"9\",{\"children\":[\"$\",\"$L22\",\"9\",{\"subtheme\":\"fairy-nook\",\"id\":109,\"registered_slots\":75,\"max_slots\":75,\"descripton\":\"LEAP 2025: LEAP into Law: A Pixiefied Perspective is a film-showing class featuring Bar Boys, a coming-of-age story that follows the journey of four friends as they navigate the challenges of law school in the Philippines. Through its portrayal of academic pressure, family dynamics, personal sacrifice, and ethical dilemmas, the film offers an engaging look into the realities of pursuing a legal career. This session aims to provide students with a deeper understanding of the law school experience while encouraging reflection on the values of perseverance, integrity, and friendship within the context of legal education.\",\"title\":\"LEAP 2025: LEAP into Law: A Pixiefied Perspective\",\"eventMedia\":{\"id\":73,\"event_id\":109,\"pub_as_bg\":1,\"pub_url\":\"/api/contentful/0gFGCJzulxySnfb0zK33I/1b83d2ae7c609e89ca029c3863ef5990/-69th_JPIA-_LEAP2025_Publicity_Materials__10__-_Althea_Beatrice_Benigay.png\",\"contentful_id\":\"1I0v2jObfdRhAn3ziSExee\"},\"slug\":\"leap-2025-leap-into-law-a-pixiefied-perspective\"}]}],[\"$\",\"div\",\"10\",{\"children\":[\"$\",\"$L22\",\"10\",{\"subtheme\":\"fairy-nook\",\"id\":121,\"registered_slots\":110,\"max_slots\":110,\"descripton\":\"LEAP 2025: Treehouse Tricks and Fairy Flicks, invites students into a world of artistic freedom, self-expression, and art therapy. Through creative projects and whimsical board games, students ignite their imaginations and explore their inner worlds. The class nurtures both playfulness and personal growth in a supportive and interactive, magical environment.\",\"title\":\"LEAP 2025: Treehouse Tricks and Fairy Flicks\",\"eventMedia\":{\"id\":83,\"event_id\":121,\"pub_as_bg\":0,\"pub_url\":\"/api/contentful/7Lw4i5Df1smX1cTrlm1NfZ/370cc70d0b489e79141b0d31d9f259b9/The_Final_Main_Pub.PNG\",\"contentful_id\":\"4bXBZore9tAr1451RnnpT8\"},\"slug\":\"treehouse-tricks-and-fairy-flicks\"}]}],[\"$\",\"div\",\"11\",{\"children\":[\"$\",\"$L22\",\"11\",{\"subtheme\":\"fairy-nook\",\"id\":168,\"registered_slots\":100,\"max_slots\":100,\"descripton\":\"LEAP 2025: Shoot That Shot is a content creation workshop designed to equip students with the basics of creating engaging and meaningful social media and vi
